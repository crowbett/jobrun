# https://taskfile.dev  --  install: go install github.com/go-task/task/v3/cmd/task@latest
version: "3"

vars:
  APP: jobrund
  MAIN: ./cmd/jobrund
  BIN: bin/{{.APP}}{{exeExt}}
  IMAGE: '{{.APP}}:local'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}
  GRPC_ADDR: '{{.GRPC_ADDR | default "localhost:50052"}}'
  DATABASE_URL: '{{.DATABASE_URL | default "postgres://jobrun:jobrun@localhost:5434/jobrun?sslmode=disable"}}'
  MIGRATIONS: internal/postgres/migrations

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task --list

  gen:
    desc: Regenerate gen/ from proto/ with buf (local protoc-gen-go + protoc-gen-go-grpc)
    cmds:
      - buf generate
    sources:
      - proto/**/*.proto
      - buf.yaml
      - buf.gen.yaml
    generates:
      - gen/**/*.pb.go

  tidy:
    desc: go mod tidy + verify
    cmds:
      - go mod tidy
      - go mod verify

  build:
    desc: Build jobrund and the jobrun CLI into bin/
    deps: [gen]
    cmds:
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN}} {{.MAIN}}
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o bin/jobrun{{exeExt}} ./cmd/jobrun
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN}}"
      - bin/jobrun{{exeExt}}

  run:
    desc: "Run jobrund locally (gRPC :50052, admin 127.0.0.1:9110; stack must be up: task db:up). Migrates on start."
    deps: [gen]
    cmds:
      - go run -ldflags="-X main.version={{.VERSION}}" {{.MAIN}}
    env:
      LOG_FORMAT: text
      DATABASE_URL: "{{.DATABASE_URL}}"
      WORKER_QUEUES: '{{.WORKER_QUEUES | default "default,bench"}}'

  admin:
    desc: Open the admin page (http://127.0.0.1:9110/admin) of a running jobrund
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "Start-Process http://127.0.0.1:9110/admin"{{else}}xdg-open http://127.0.0.1:9110/admin || open http://127.0.0.1:9110/admin{{end}}'

  client:
    desc: "Run the jobrun CLI against a running jobrund (task client -- enqueue|get|list|cancel|retry|schedule ...)"
    cmds:
      - go run ./cmd/jobrun -addr {{.GRPC_ADDR}} {{.CLI_ARGS}}

  bench:
    desc: "Load test a running jobrund at the plan's target (override: task bench -- --rate 300 --direct)"
    cmds:
      - go run ./cmd/jobrun -addr {{.GRPC_ADDR}} bench --rate 200 --duration 60s {{.CLI_ARGS}}
    env:
      DATABASE_URL: "{{.DATABASE_URL}}"

  db:up:
    desc: Start postgres (5434) and wait for health
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: Stop the compose stack (keeps volumes)
    cmds:
      - docker compose down

  migrate:
    desc: goose up against DATABASE_URL
    cmds:
      - goose -dir {{.MIGRATIONS}} postgres "{{.DATABASE_URL}}" up

  migrate:down:
    desc: goose down one step
    cmds:
      - goose -dir {{.MIGRATIONS}} postgres "{{.DATABASE_URL}}" down

  migrate:status:
    desc: goose status against DATABASE_URL
    cmds:
      - goose -dir {{.MIGRATIONS}} postgres "{{.DATABASE_URL}}" status

  sqlc:
    desc: Regenerate internal/postgres/sqlc from db/query + migrations
    cmds:
      - sqlc generate
      - sqlc vet
    sources:
      - db/query/*.sql
      - "{{.MIGRATIONS}}/*.sql"
      - sqlc.yaml

  test:integration:
    desc: Tests that need the compose stack (-tags integration)
    deps: [db:up]
    cmds:
      - go test -race -count=1 -tags integration ./...
    env:
      CGO_ENABLED: "1"
      TEST_DATABASE_URL: "{{.DATABASE_URL}}"

  test:
    desc: Run tests with the race detector (needs a C compiler on Windows)
    cmds:
      - go test -race -count=1 ./...
    env:
      CGO_ENABLED: "1"

  test:fast:
    desc: Run tests without -race
    cmds:
      - go test -count=1 ./...

  cover:
    desc: Coverage report (opens HTML)
    cmds:
      - go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -func=coverage.out
      - go tool cover -html=coverage.out -o coverage.html

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  lint:
    desc: buf lint + golangci-lint
    cmds:
      - buf lint
      - golangci-lint run ./...

  lint:breaking:
    desc: buf breaking check against the main branch
    cmds:
      - buf breaking --against ".git#branch=main"

  fmt:
    desc: Format protos (buf) and Go (gofumpt + goimports)
    cmds:
      - buf format -w
      - golangci-lint fmt ./...

  vuln:
    desc: govulncheck
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  check:
    desc: tidy + vet + lint + test
    deps: [tidy]
    cmds:
      - task: vet
      - task: lint
      - task: test:fast

  docker:build:
    desc: Build the container image
    cmds:
      - docker build -t {{.IMAGE}} --build-arg VERSION={{.VERSION}} .

  docker:run:
    desc: "Run the container on :50052 (DATABASE_URL must point at a reachable postgres)"
    cmds:
      - docker run --rm -p 50052:50052 -e LOG_FORMAT=text -e DATABASE_URL="{{.DATABASE_URL}}" {{.IMAGE}}

  clean:
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "Remove-Item -Recurse -Force bin, coverage.out, coverage.html -ErrorAction SilentlyContinue"{{else}}rm -rf bin coverage.out coverage.html{{end}}'
