{{- $s := .Values.server }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jobrun.serverName" . }}
  labels:
    {{- include "jobrun.componentLabels" (dict "ctx" $ "component" "server") | nindent 4 }}
spec:
  {{- if not $s.autoscaling.enabled }}
  replicas: {{ $s.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current capacity: a new pod must be Ready (migrated, serving)
      # before an old one starts its staged teardown.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "jobrun.componentSelectorLabels" (dict "ctx" $ "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobrun.componentLabels" (dict "ctx" $ "component" "server") | nindent 8 }}
        {{- with $s.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.database.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.adminPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with $s.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "jobrun.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $s.terminationGracePeriodSeconds }}
      enableServiceLinks: false
      containers:
        - name: jobrund
          image: {{ include "jobrun.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "jobrun.serverName" . }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "jobrun.databaseSecretName" . }}
                  key: {{ .Values.database.secretKey }}
            # GOMEMLIMIT tracks the memory limit so the GC works before the OOM killer does.
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
            {{- with $s.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $s.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if gt (int $s.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              # Native sleep action: distroless has no shell to run `sleep` in.
              sleep:
                seconds: {{ $s.preStopSleepSeconds }}
          {{- end }}
          resources:
            {{- toYaml $s.resources | nindent 12 }}
      {{- with $s.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- if $s.topologySpreadConstraints }}
        {{- toYaml $s.topologySpreadConstraints | nindent 8 }}
        {{- else }}
        {{- include "jobrun.defaultSpread" (dict "ctx" $ "component" "server") | nindent 8 }}
        {{- end }}
