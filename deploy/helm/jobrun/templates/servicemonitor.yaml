{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if not (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
{{- fail "jobrun: metrics.serviceMonitor.enabled needs the prometheus-operator CRDs (monitoring.coreos.com/v1)" }}
{{- end }}
# Remember networkPolicy.adminFrom: Prometheus must be allowed to reach the admin port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "jobrun.serverName" . }}
  labels:
    {{- include "jobrun.componentLabels" (dict "ctx" $ "component" "server") | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "jobrun.componentSelectorLabels" (dict "ctx" $ "component" "server") | nindent 6 }}
  endpoints:
    - port: admin
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
