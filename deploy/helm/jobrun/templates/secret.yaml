{{- if and (not .Values.database.existingSecret) .Values.database.url }}
# Rendered from database.url: for local clusters. Production uses database.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jobrun.databaseSecretName" . }}
  labels:
    {{- include "jobrun.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ .Values.database.url | quote }}
{{- end }}
