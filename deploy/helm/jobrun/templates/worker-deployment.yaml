{{- if .Values.worker.enabled }}
{{- $w := .Values.worker }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jobrun.workerName" . }}
  labels:
    {{- include "jobrun.componentLabels" (dict "ctx" $ "component" "worker") | nindent 4 }}
spec:
  {{- if not $w.autoscaling.enabled }}
  replicas: {{ $w.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "jobrun.componentSelectorLabels" (dict "ctx" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobrun.componentLabels" (dict "ctx" $ "component" "worker") | nindent 8 }}
        {{- with $w.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $w.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "jobrun.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $w.terminationGracePeriodSeconds }}
      enableServiceLinks: false
      containers:
        - name: jobworker
          image: {{ include "jobrun.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/jobworker"]
          args:
            - -concurrency={{ $w.concurrency }}
            - -job-timeout={{ $w.jobTimeout }}
            - -drain={{ $w.drainSeconds }}s
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: JOBRUN_ADDR
              value: {{ include "jobrun.grpcAddr" . | quote }}
            - name: WORKER_QUEUES
              value: {{ join "," $w.queues | quote }}
            # Leases show up as owner remote:<pod name> in `jobrun list`.
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP_ENV
              value: {{ .Values.config.appEnv | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: OTEL_ENABLED
              value: {{ .Values.config.otel.enabled | quote }}
            {{- with .Values.config.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
            {{- with $w.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # jobworker opens no listener, so there is nothing to probe. It reconnects to the
          # server with backoff by itself, and a hung handler is bounded by -job-timeout and
          # lease fencing (the server-side lease expires and the reaper requeues the job).
          resources:
            {{- toYaml $w.resources | nindent 12 }}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- if $w.topologySpreadConstraints }}
        {{- toYaml $w.topologySpreadConstraints | nindent 8 }}
        {{- else }}
        {{- include "jobrun.defaultSpread" (dict "ctx" $ "component" "worker") | nindent 8 }}
        {{- end }}
{{- end }}
