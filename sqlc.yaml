# https://docs.sqlc.dev/en/latest/reference/config.html
# task sqlc   -> regenerates internal/postgres/sqlc from db/query/*.sql against the goose migrations.
version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/postgres/migrations"
    queries: "db/query"
    gen:
      go:
        package: "sqlc"
        out: "internal/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
